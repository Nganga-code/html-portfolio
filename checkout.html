<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - International Herb Africa</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

/* HEADER */
header {
    background: #0c3d2c;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cart-icon {
    cursor: pointer;
    position: relative;
    font-size: 22px;
}

.cart-count {
    position: absolute;
    top: -8px;
    right: -10px;
    background: red;
    color: white;
    font-size: 12px;
    padding: 3px 6px;
    border-radius: 50%;
}

/* CONTAINER */
.container {
    max-width: 500px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* FORM */
input, textarea, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button {
    background: #0c3d2c;
    color: white;
    border: none;
    cursor: pointer;
}

/* CART ITEMS */
.cart-item {
    border-bottom: 1px solid #ddd;
    padding: 8px 0;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h2>Checkout</h2>

    <div class="cart-icon">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </div>
</header>

<!-- CONTENT -->
<div class="container">

    <h3>Your Order</h3>
    <div id="cartItems"></div>

    <h3>Your Details</h3>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="tel" id="phone" placeholder="Phone Number" required>
    <textarea id="address" placeholder="Delivery Address"></textarea>

    <button onclick="getLocation()">📍 Use My Location</button>

    <button onclick="sendOrder()">Send Order via WhatsApp</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart() {
    let html = "";
    let total = 0;

    cart.forEach(item => {
        html += `<div class="cart-item">${item.name} - R${item.price}</div>`;
        total += item.price;
    });

    html += `<h4>Total: R${total}</h4>`;

    document.getElementById("cartItems").innerHTML = html;
    document.getElementById("cartCount").innerText = cart.length;
}

displayCart();

let userLocation = "";

function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;
            userLocation = `https://maps.google.com/?q=${lat},${lon}`;
            alert("✅ Location captured!");
        });
    } else {
        alert("❌ Location not supported");
    }
}

function sendOrder() {
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;

    if (!name || !phone) {
        alert("Please fill in your name and phone number");
        return;
    }

    let message = "🌿 *New Order* 🌿\n\n";

    cart.forEach(item => {
        message += `- ${item.name} (R${item.price})\n`;
    });

    message += `\n💰 Total: R${cart.reduce((t,i)=>t+i.price,0)}`;
    message += `\n\n👤 Name: ${name}`;
    message += `\n📞 Phone: ${phone}`;
    message += `\n🏠 Address: ${address}`;
    message += `\n📍 Location: ${userLocation}`;

    // 🔴 REPLACE NUMBER BELOW
    let whatsapp = `https://wa.me/27615814840?text=${encodeURIComponent(message)}`;

    window.open(whatsapp, "_blank");
}
</script>

</body>
</html>
