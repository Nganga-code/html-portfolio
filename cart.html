<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - International Herb Africa</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/favicon.ico" type="image/x-icon">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

<style>
body{margin:0;font-family:Arial;}
header, footer{background:#064d00;color:#fff;padding:14px 16px;text-align:center;}
.main{padding:20px;}
.cart-item{display:flex;gap:12px;margin-bottom:12px;border:1px solid #eee;padding:10px;border-radius:12px;}
.cart-item img{width:80px;border-radius:8px;}
.item-info h3{margin:0;font-size:16px;}
.qty-box button{padding:4px 8px;}
</style>
</head>
<body>

<header>
<h1>Cart - International Herb Africa</h1>
</header>

<div class="main">
<div id="cart-items"></div>
<div style="margin-top:20px;">
<label>Tip for driver: R</label>
<input type="number" id="driver-tip" value="0" min="0" step="1"/>
</div>
<h3>Total: R<span id="total">0.00</span></h3>
<button onclick="checkout()">Checkout</button>
</div>

<footer>
<p>Contact us: info@internationalherbafrica.co.za</p>
<small>© 2025 International Herb Africa. All Rights Reserved.</small>
</footer>

<script>

if("serviceWorker" in navigator){
navigator.serviceWorker.register("/service-worker.js");
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt", e=>{
e.preventDefault();
deferredPrompt = e;
});

function installApp(){
deferredPrompt.prompt();
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let driverTip = parseFloat(document.getElementById('driver-tip').value) || 0;

function renderCart() {
  const container = document.getElementById('cart-items');
  container.innerHTML = '';
  let total = 0;
  cart.forEach((item,i)=>{
    const subtotal = item.price * item.qty;
    total += subtotal;
    const div = document.createElement('div');
    div.className='cart-item';
    div.innerHTML = `
      <img src="/uploads/${item.image}" />
      <div class="item-info">
        <h3>${item.name}</h3>
        <p>R${item.price}</p>
        <p>Qty: <button onclick="changeQty(${i},-1)">−</button> ${item.qty} <button onclick="changeQty(${i},1)">+</button></p>
        <p>Subtotal: R${subtotal.toFixed(2)}</p>
        <button onclick="removeItem(${i})">Remove</button>
      </div>
    `;
    container.appendChild(div);
  });
  driverTip = parseFloat(document.getElementById('driver-tip').value) || 0;
  total += driverTip;
  document.getElementById('total').textContent = total.toFixed(2);
}

function changeQty(i,delta){
  cart[i].qty += delta;
  if(cart[i].qty<1) cart[i].qty=1;
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

async function checkout(){
  if(cart.length===0){ alert('Cart is empty!'); return; }
  const customer = { id:1, name:'John Doe', email:'john@example.com' }; // Example
  const order = { id:Date.now(), customer, items:cart, total:cart.reduce((a,i)=>a+i.price*i.qty,0)+driverTip, tip:driverTip };
  const r = await fetch('/api/orders', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(order)});
  const data = await r.json();
  alert('Order placed! Invoice ID: '+data.order.id);
  cart = [];
  localStorage.setItem('cart','[]');
  renderCart();
}

renderCart();
</script>

</body>
</html>
