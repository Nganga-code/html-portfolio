<script>

if("serviceWorker" in navigator){
      navigator.serviceWorker.register("/service-worker.js");
    }

window.addEventListener("beforeinstallprompt", e=>{
e.preventDefault();
deferredPrompt = e;
});

function installApp(){
deferredPrompt.prompt();
}

    document.addEventListener("DOMContentLoaded", function() {
      loadOrderHistory();
    });

    async function loadOrderHistory(){
    const res = await fetch("/api/orders?userId=USER123");
    const data = await res.json();
    const orderHistoryDiv = document.getElementById("orderHistory");
    orderHistoryDiv.innerHTML = "";
    data.orders.forEach(order => {
        const orderDiv = document.createElement("div");
        orderDiv.classList.add("order");
        orderDiv.innerHTML = `
            <h4>Order ID: ${order.id}</h4>
            <p>Status: ${order.status}</p>
            <p>Total: R${order.total}</p>
        `;
        orderHistoryDiv.appendChild(orderDiv);
    });
}

async function dispatchOrder(){

const res = await fetch("/api/dispatch-order",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
orderId:"ORD1234",
lat:customerLat,
lng:customerLng
})
});
}

socket.on("driverLocation",(data)=>{

 marker.setPosition({
  lat:data.lat,
  lng:data.lng
 });

});

async function payNow(){

const res = await fetch("/api/pay",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({
_id:"ORDER123",
total:150
})
});

const data = await res.json();

window.location = data.url;

}

const socket = io();

socket.on("notification", data=>{

alert("🔔 " + data.message);

});


function trackOrder(id){
window.location = `customer-tracking.html?id=${id}`;
}

const orderId = new URLSearchParams(location.search).get("id");

socket.emit("joinOrder", orderId);

function sendMsg(){

const msg = document.getElementById("msg").value;

socket.emit("sendMessage", {
orderId,
text: msg,
sender: "customer"
});

document.getElementById("msg").value = "";

}

socket.on("newMessage", data=>{

const box = document.getElementById("chatBox");

box.innerHTML += `<p><b>${data.sender}:</b> ${data.text}</p>`;
box.scrollTop = box.scrollHeight;

});

async function submitReview(){

await fetch("/api/review",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({
orderId:"ORDER123",
rating: document.getElementById("rating").value,
comment: document.getElementById("comment").value
})
});

alert("Thanks for your review!");

}
  </script>
