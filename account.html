<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Settings</title>
<link rel="icon" href="images/favicon.ico" type="image/x-icon">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 30px;
  background: #f8fafc;
}

.card {
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
}
button {
  margin-top: 15px;
  padding: 10px;
  background: #0f766e;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="card">
  <h3>Account Settings</h3>

  <label>Name</label>
  <input type="text" value="Super Admin">

  <label>Email</label>
  <input type="email" value="admin@internationalherb.africa">

  <label>New Password</label>
  <input type="password">

  <button>Update Account</button>

  <button onclick="logout()">Logout</button>
</div>

<footer style="margin-top:40px;text-align:center;font-size:12px;color:#555;">
  &copy; 2025 International Herb Africa. All Rights Reserved.
</footer>

<script>
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("/service-worker.js");
  }
;

  let deferredPrompt;

  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault();
    deferredPrompt = e;
  });

  function installApp(){
    deferredPrompt.prompt();
  }

  function checkUser(){
    let user = JSON.parse(localStorage.getItem("user"));
    if(user){
      console.log("Logged in:", user.email);
    }
  }

  checkUser();


  function register() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  let user = { email, password };

  localStorage.setItem("user", JSON.stringify(user));

  alert("Account created successfully!");

  // 🔥 Redirect back to where user was going
  let redirect = localStorage.getItem("redirectAfterLogin");

  if (redirect) {
    localStorage.removeItem("redirectAfterLogin");
    window.location.href = redirect;
  } else {
    window.location.href = "index.html";
  }
}

  function logout(){
    localStorage.removeItem("user");
    window.location.href = "index.html";
  }

  function checkout() {
  let cart = getCart();

  if (cart.length === 0) {
    alert("Your cart is empty");
    return;
  }

  let user = JSON.parse(localStorage.getItem("user"));

  if (!user || !user.email) {
    alert("Please create an account to continue");

    //  🔥 Save the intended redirect page after login
    localStorage.setItem("redirectAfterLogin", "checkout.html");
    window.location.href = "signup.html";
  } else {
    window.location.href = "checkout.html";
  }
}

</script>
</body>
</html>
